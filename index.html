function shrink(f){return new Promise((ok,no)=>{const i=new Image(),u=URL.createObjectURL(f);i.onload=()=>{const s=Math.min(1,1600/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.8))};i.onerror=no;i.src=u})}

async function aiRun(){
  if(!AI.url){setOs('fb oops','還沒設定 AI 服務，請到首頁「家長專區」填寫。');return}
  if(!PF.length){setOs('fb oops','請先選擇照片。');return}
  try{
    setOs('sub','⏳ AI 正在閱讀 '+PF.length+' 張照片，請稍等 30～90 秒…（照片會傳到 AI 服務處理）');
    const images=await Promise.all(PF.slice(0,8).map(shrink));
    const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),150000);
    let raw;
    if(/^AIza/.test(AI.url)){
      const gp=images.map(u=>{const m=u.match(/^data:(image\/[a-z+.-]+);base64,(.+)$/i);return {inline_data:{mime_type:m[1],data:m[2]}}});
      let txt='',last='fail';
      for(const md of GM){
        const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+md+':generateContent',{method:'POST',headers:{'content-type':'application/json','x-goog-api-key':AI.url},body:JSON.stringify({contents:[{parts:[{text:AIPROMPT},...gp]}],generationConfig:{responseMimeType:'application/json',maxOutputTokens:8192,temperature:0.2}}),signal:ctl.signal});
        if(r.ok){const d=await r.json();const c=arr(d.candidates)[0];txt=arr(c&&c.content&&c.content.parts).map(q=>q.text||'').join('');if(txt)break;last='fail';continue}
        last=r.status===429?'quota':(r.status===400||r.status===401||r.status===403)?'bad_key':'fail';
        if(r.status===429)break;
      }
      clearTimeout(tm);
      if(!txt)throw last;
      const m=txt.match(/\{[\s\S]*\}|\[[\s\S]*\]/);if(!m)throw 'fail';
      const j=JSON.parse(m[0]);raw=Array.isArray(j)?j:j.lessons;
    }else if(/^sk-ant-/.test(AI.url)){
      const parts=images.map(u=>{const m=u.match(/^data:(image\/[a-z+.-]+);base64,(.+)$/i);return {type:'image',source:{type:'base64',media_type:m[1],data:m[2]}}});
      const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':AI.url,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-5-5',max_tokens:6000,messages:[{role:'user',content:[...parts,{type:'text',text:AIPROMPT}]}]}),signal:ctl.signal});
      clearTimeout(tm);
      if(r.status===401)throw 'bad_key';
      const d=await r.json();if(!r.ok)throw 'fail';
      const txt=arr(d.content).filter(b=>b.type==='text').map(b=>b.text).join('');
      const m=txt.match(/\{[\s\S]*\}/);if(!m)throw 'fail';
      raw=JSON.parse(m[0]).lessons;
    }else{
      const r=await fetch(AI.url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({images,code:AI.code}),signal:ctl.signal});
      clearTimeout(tm);
      const d=await r.json();
      if(!r.ok)throw d.error||'fail';
      raw=d.lessons;
    }
    const list=arr(raw).map(norm).filter(Boolean);
    if(!list.length)throw 'empty';
    const ti=(document.getElementById('lt')||{value:''}).value.trim();
    if(ti&&list.length===1)list[0].t=ti;
    list.forEach(s=>{SEC.push(s);LS.push(s)});saveLS();
    S.s=SEC.length-list.length;S.v=list.length===1?'sec':'home';render();
  }catch(e){setOs('fb oops',e==='quota'?'今天的免費額度用完，或按得太頻繁，請稍後再試。':e==='bad_key'?'金鑰不正確或額度不足，請到「家長專區」確認。':e==='bad_code'?'通關碼不正確，請到「家長專區」確認。':'AI 辨識沒有成功，請確認網路與照片是否清楚，或稍後再試。')}
}

function parseText(x){
  const out=[],seen=new Set();
  x.split(/\n+/).map(l=>l.trim()).filter(Boolean).forEach(l=>{
    const e=(l.match(/[A-Za-z][A-Za-z0-9'’ .,!?\-\/]*/)||[''])[0].replace(/’/g,"'").trim();
    if(!/[A-Za-z]{2}/.test(e))return;
    const z=(l.match(/[\u4e00-\u9fff][^A-Za-z]*/)||[''])[0].replace(/[\s:：\-=]+$/,'').trim();
    const k=e.toLowerCase();if(seen.has(k))return;seen.add(k);
    const n=e.split(/\s+/).length;
    out.push([e,z,(n>=4||(n>=2&&/[.!?]$/.test(e)))?'💬':'🔤']);
  });
  return out.slice(0,60);
}

  const st=m=>SM.includes(m)?bar(star(S.s,m)):(P[S.s+m]?'✅':'');
  return `${back('home','回到課程目錄')}<h2>${s.ic} ${s.t}<em>${s.en}</em></h2><p class="sub" style="margin-top:-8px">${s.custom?'作業日期 '+(s.date||''):'課本 '+s.pg}</p><div class="modes">
  ${s.m.map(m=>`<button class="btn" data-a="mode" data-m="${m}"><span class="ic">${ML[m][0]}</span><span><b>${ML[m][1]}</b><span class="d">${ML[m][2]}</span></span><span class="st">${st(m)}</span></button>`).join('')}</div>${s.custom?'<button class="go alt" style="margin-top:22px" data-a="del">🗑️ 刪除這份作業</button>':''}`;
}
function cards(){
  const s=SEC[S.s],w=s.w[S.i],last=S.i===s.w.length-1;
  return `${back('sec','回到單元')}<button class="fc" data-a="flip" aria-label="翻面">${S.flip?`<span class="zh ${w[1].length>8?'s':''}">${w[1]||'（沒有中文）'}</span><span class="hint">再點一下，看圖片</span>`:`<span class="big">${w[2]}</span><span class="w en ${w[0].length>14?'s':''}">${w[0]}</span><span class="hint">點卡片看中文</span>`}</button>
  <div class="nav"><button class="say" data-a="word" aria-label="播放發音">🔊</button>
  <button class="go alt" data-a="prev" ${S.i===0?'disabled style="opacity:.4"':''}>上一張</button>
  <span class="cnt">${S.i+1} / ${s.w.length}</span>
  <button class="go" data-a="next">${last?'完成 ✔':'下一張'}</button></div>`;
}
function info(){
  const f=SEC[S.s].info;
  return `${back('sec','回到單元')}<h2>📖 ${f.h}</h2><p>點一下 🔊，跟著唸一唸。</p>
  ${f.r.map((r,i)=>`<div class="say-l"><button class="say" data-a="irow" data-i="${i}" aria-label="播放">🔊</button><div class="bub"><span class="e">${r[0]}</span><span class="z">${r[1]}</span></div></div>`).join('')}`;
}
function dream(){
  const j=SEC[1].w.slice(0,12),c=S.dj!==null?j[S.dj]:null;
  return `${back('sec','回到單元')}<h2>🌟 What do you want to be?</h2><p>點一個你想當的職業。</p>
  <div class="opts g3">${j.map((w,k)=>`<button class="opt ${S.dj===k?'ok':''}" data-a="dj" data-k="${k}">${w[2]}<small>${w[1]}</small></button>`).join('')}</div>
  ${c?`<div class="say-l r" style="margin-top:18px"><button class="say" data-a="dsay" aria-label="播放">🔊</button><div class="bub"><span class="e">I want to be ${c[0]}.</span><span class="z">我想當${c[1]}。</span></div></div>`:''}`;
}
function quiz(){
  const q=S.qs[S.i];
  if(S.done){
    const st=calc(S.sc,S.qs.length);
    const m=['先回去看看單字卡，再來挑戰吧！','不錯喔，再練習一次會更棒！','很棒喔！只差一點點！','太厲害了，全部都答對！'][st];
    return `<section class="res"><div class="stars">${bar(st)}</div><h2>${m}</h2><p>答對 ${S.sc} / ${S.qs.length} 題</p>
    <button class="go" data-a="mode" data-m="${S.mode}">再玩一次</button><button class="go alt" data-a="sec">回到單元</button></section>`;
  }
  const p=S.pick,right=p!==null&&q.o[p].ok,last=S.i===S.qs.length-1;
  return `${back('sec','回到單元')}<div class="prog"><span>第 ${S.i+1} / ${S.qs.length} 題</span><span>答對 ${S.sc}</span></div>
  <section class="q"><button class="say" data-a="play" aria-label="播放">🔊</button><p>${q.p}</p></section>
  <div class="opts ${q.big?'big':''}">${q.o.map((o,k)=>`<button class="opt ${p!==null?(o.ok?'ok':(p===k?'bad':'')):''}" data-a="pick" data-k="${k}" ${p!==null?'disabled':''}>${o.l}</button>`).join('')}</div>
  ${p!==null?`<p class="fb ${right?'good':'oops'}">${right?'🎉 答對了！':'再接再厲！正確答案：'} ${q.fb}</p><button class="go" data-a="nxt">${last?'看結果':'下一題'}</button>`:''}`;
}
function render(){app.innerHTML={home,sec,cards,info,dream,quiz,add,parent:parentV,dict,order}[S.v]()+spdBtn();if(S._v!==S.v){window.scrollTo(0,0);S._v=S.v}}
function startQuiz(m){
  if(m==='dict'||m==='order'){startPr(m);return}
  const s=SEC[S.s];
  if(m==='listen'){
    S.qs=shuf(s.w).slice(0,6).map(w=>({play:w[0],p:'聽聽看，哪一個是這個說法？',big:1,fb:`${w[0]} ＝ ${w[1]}`,o:shuf([w,...shuf(s.w.filter(x=>x!==w)).slice(0,3)]).map(x=>({l:x[2],ok:x===w}))}));
  }else if(m==='blend'){
    S.qs=shuf(s.w).slice(0,6).map(w=>({play:w[0],p:'聽聽看，這個字用哪一個字母組合開頭？',big:1,fb:`${w[0]} ＝ ${w[1]}`,o:shuf(['sm','sn','sw','sl']).map(x=>({l:x,ok:w[0].startsWith(x)}))}));
  }else{
    S.qs=shuf(s.d).map(d=>({play:d[0],p:`${d[0]}<span class="z">${d[1]}</span>`,fb:`${d[2]}（${d[3]}）`,ans:d[2],o:shuf([d[2],...d[4]]).map(x=>({l:x,ok:x===d[2]}))}));
  }
  S.v='quiz';S.mode=m;S.i=0;S.sc=0;S.pick=null;S.done=false;render();say(S.qs[0].play);
}
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  const a=b.dataset.a,s=SEC[S.s];
  if(a==='vtest'){say("Hello! Nice to meet you. Let's learn English together!");return}
  else if(a==='home'){S.v='home'}
  else if(a==='add'){PF=[];S.v='add'}
  else if(a==='ai'){aiRun();return}
  else if(a==='aisave'){AI.url=document.getElementById('aiu').value.trim();AI.code=document.getElementById('aic').value.trim();try{localStorage.setItem('english-park-ai',JSON.stringify(AI))}catch(x){}b.textContent='✅ 已儲存';return}
  else if(a==='paste'){
    const n=+b.dataset.k+1;
    try{navigator.clipboard.readText().then(x=>{const lx=document.getElementById('lx');
      if(lx&&x&&x.trim()){lx.value=(lx.value?lx.value+'\n':'')+x.trim();b.textContent='✅ 已貼上第 '+n+' 張（可再貼一次）';setOs('sub','✅ 已貼上，請檢查最下方的文字。')}
      else setOs('fb oops','剪貼簿是空的。請先在照片上長按文字並選「拷貝」。')}).catch(()=>setOs('fb oops','無法讀取剪貼簿。請長按最下方的文字框，選「貼上」。'))}
    catch(x){setOs('fb oops','無法讀取剪貼簿。請長按最下方的文字框，選「貼上」。')}
    return}
  else if(a==='del'){if(confirm('確定刪除這份作業嗎？')){s.del=1;saveLS();S.v='home'}}
  else if(a==='spd'){spi=(spi+1)%SP.length;try{localStorage.setItem('english-park-spd',spi)}catch(x){}b.textContent='🔊 語速：'+SP[spi].n;say('Listen and repeat.');return}
  else if(a==='mk'){mkLesson();return}
  else if(a==='goal'){GOAL=+b.dataset.g;try{localStorage.setItem('english-park-goal',GOAL)}catch(x){}}
  else if(a==='clr'){if(confirm('確定要清除自己建立的課程嗎？')){SEC.length=SEC0.length;LS=[];saveLS()}}
  else if(a==='ptask'){const k=S.s+'p'+b.dataset.i;P[k]=P[k]?0:1;save()}
  else if(a==='dplay'){say(S.qs[S.i][0]);return}
  else if(a==='tp'){S.bt.push(+b.dataset.k);render();say(S.tl[+b.dataset.k]);return}
  else if(a==='tb'){S.bt.splice(+b.dataset.j,1)}
  else if(a==='dchk'){
    S.ok=S.v==='dict'?nz(S.val)===nz(S.qs[S.i][0]):S.bt.map(k=>S.tl[k]).join(' ')===S.qs[S.i][0].trim().split(/\s+/).join(' ');
    S.pick=true;if(S.ok)S.sc++;render();say(S.qs[S.i][0]);return}
  else if(a==='dnext'){
    if(S.i<S.qs.length-1){S.i++;S.pick=null;S.val='';if(S.v==='order')mkTiles();render();say(S.qs[S.i][0]);return}
    S.done=true;const st=calc(S.sc,S.qs.length),key=S.s+S.mode;if(st>(P[key]||0)){P[key]=st;save()}}
  else if(a==='sec'){if(b.dataset.i!==undefined)S.s=+b.dataset.i;S.v='sec'}
  else if(a==='mode'){
    const m=b.dataset.m;S.mode=m;
    if(m==='cards'){S.v='cards';S.i=0;S.flip=false;render();say(s.w[0][0]);return}
    if(m==='info'){P[S.s+'info']=1;save();S.v='info'}
    else if(m==='parent'){S.v='parent'}
    else if(m==='dream'){P[S.s+'dream']=1;save();S.v='dream';S.dj=null}
    else{startQuiz(m);return}
  }
  else if(a==='flip'){S.flip=!S.flip}
  else if(a==='word'){say(s.w[S.i][0]);return}
  else if(a==='prev'){if(S.i>0){S.i--;S.flip=false;render();say(s.w[S.i][0])}return}
  else if(a==='next'){
    if(S.i<s.w.length-1){S.i++;S.flip=false;render();say(s.w[S.i][0]);return}
    P[S.s+'cards']=1;save();S.v='sec';
  }
  else if(a==='irow'){const r=s.info.r[+b.dataset.i];say(r[2]||r[0]);return}
  else if(a==='dj'){S.dj=+b.dataset.k;render();say('I want to be '+SEC[1].w[S.dj][0]+'.');return}
  else if(a==='dsay'){say('I want to be '+SEC[1].w[S.dj][0]+'.');return}
  else if(a==='play'){say(S.qs[S.i].play);return}
  else if(a==='pick'){
    const k=+b.dataset.k,q=S.qs[S.i];if(S.pick!==null)return;
    S.pick=k;if(q.o[k].ok)S.sc++;
    render();if(q.ans)say(q.ans);return;
  }
  else if(a==='nxt'){
    if(S.i<S.qs.length-1){S.i++;S.pick=null;render();say(S.qs[S.i].play);return}
    S.done=true;
    const st=calc(S.sc,S.qs.length),key=S.s+S.mode;
    if(st>(P[key]||0)){P[key]=st;save()}
  }
  render();
});
app.addEventListener('change',e=>{if(e.target.id==='vs'){VP=e.target.value;try{localStorage.setItem('english-park-voice',VP)}catch(x){}say("Hello! Nice to meet you.")}});
try{if(window.speechSynthesis){window.speechSynthesis.getVoices();window.speechSynthesis.onvoiceschanged=()=>{if(S.v==='home'&&!document.querySelector('details[open]'))render()}}}catch(e){}
(function(){try{const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');
x.fillStyle='#2f6fe4';x.fillRect(0,0,180,180);x.fillStyle='#ffe27a';x.beginPath();x.roundRect(24,40,132,100,16);x.fill();
x.fillStyle='#1b2a5c';x.font='700 64px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('ABC',90,92);
document.getElementById('touch').href=c.toDataURL('image/png')}catch(e){}})();
render();
