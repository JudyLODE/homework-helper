/* 數學「教我怎麼算」：位值籌碼 + 直式進位 + 線段圖，全部由題目的數字自動算出 */
const TCH=(()=>{
const F='font-family="Noto Sans TC,PingFang TC,Microsoft JhengHei,sans-serif"';
const INK='#1b2a5c',COL=['#ffd54f','#81d4fa','#a5d6a7','#e1bee7','#ffab91'],NM=['一','十','百','千','萬'],PN=['個位','十位','百位','千位','萬位'],VAL=[1,10,100,1000,10000];
const tx=(x,y,t,o={})=>`<text x="${x}" y="${y}" ${F} font-size="${o.s||14}" font-weight="${o.w||700}" fill="${o.c||INK}" text-anchor="${o.a||'start'}">${t}</text>`;
const tok=(x,y,p,o={})=>{const l=String(VAL[p]);return `<rect x="${x}" y="${y}" width="${o.w||24}" height="${o.h||16}" rx="5" fill="${COL[p]}" stroke="${o.ring?'#e53935':'#546e7a'}" stroke-width="${o.ring?2.2:1.2}" ${o.ring?'stroke-dasharray="4 2"':''}/>`+tx(x+(o.w||24)/2,y+(o.h||16)/2+(l.length>3?3:4),l,{a:'middle',s:l.length>4?7:l.length>3?8:10,c:'#263238'})};
const svg=(h,b,cap)=>`<svg viewBox="0 0 360 ${h}" role="img" aria-label="${cap}" style="width:100%;height:auto;display:block;background:#fff;border:3px solid #1b2a5c;border-radius:16px">${b}</svg>`;

function parse(q){
  const src=[q[0],q[2],...(q[3]||[])].map(String);let m=null;
  for(const t of src){m=t.match(/(\d+)\s*[×xX＊*]\s*(\d+)/);if(m)break}
  if(!m)return null;let a=+m[1],b=+m[2];
  if(b>9&&a<=9){[a,b]=[b,a]}
  const ans=+String(q[1]).replace(/[^\d]/g,'');
  if(!(a>=10&&a<=9999&&b>=2&&b<=9)||a*b!==ans)return null;
  return {a,b,ans,word:!/^[\d\s×xX＝=？?]+$/.test(String(q[0]))};
}
function bar(a,b){
  const n=b,gap=4,W=330,bw=Math.min(70,(W-gap*(n-1))/n),tot=n*bw+gap*(n-1),x0=(360-tot)/2;
  let s='';for(let i=0;i<n;i++)s+=`<rect x="${x0+i*(bw+gap)}" y="64" width="${bw}" height="46" rx="6" fill="#ffe082" stroke="#8d6e00" stroke-width="2"/>`+tx(x0+i*(bw+gap)+bw/2,93,a,{a:'middle',s:bw<40?13:18});
  s+=`<path d="M${x0} 54Q${x0} 44 ${x0+10} 44H${x0+tot/2-10}Q${x0+tot/2} 44 ${x0+tot/2} 34Q${x0+tot/2} 44 ${x0+tot/2+10} 44H${x0+tot-10}Q${x0+tot} 44 ${x0+tot} 54" fill="none" stroke="#e53935" stroke-width="2.6"/>`+tx(x0+tot/2,26,'一共 ＝ ？',{a:'middle',s:17,c:'#e53935'});
  s+=`<path d="M${x0} 120V128H${x0+bw}V120" fill="none" stroke="${INK}" stroke-width="2.4"/>`+tx(x0+bw/2,148,'每份 '+a,{a:'middle',s:13})+tx(180,178,`共 ${b} 份，每份一樣多 → 用乘法`,{a:'middle',s:14});
  return svg(196,s,`${b} 份，每份 ${a}`);
}
function arr(d,b,cin,p){
  const w=24,h=16,g=4;let s='',y=34;
  s+=tx(180,20,`${d} 個「${VAL[p]}」× ${b} 組`,{a:'middle',s:15});
  const cols=Math.max(d,1),x0=(360-cols*(w+g)+g)/2;
  if(d>0)for(let r=0;r<b;r++){for(let c=0;c<d;c++)s+=tok(x0+c*(w+g),y,p);y+=h+g+2}
  else{s+=tx(180,y+14,'0 個，沒有東西',{a:'middle',s:14,c:'#78909c'});y+=26}
  if(cin>0){s+=tx(14,y+12,'進位來的：',{s:12});for(let c=0;c<cin;c++)s+=tok(96+c*(w+g),y,p,{ring:1});y+=h+8}
  return svg(y+8,s,`${d} 個${NM[p]} 乘 ${b}`);
}
function reg(total,p){
  const f=Math.floor(total/10),r=total%10,w=24,h=16,g=3;let s='',y=14;
  for(let i=0;i<f;i++){
    for(let c=0;c<10;c++)s+=tok(10+c*(w+g),y+3,p);
    s+=`<rect x="6" y="${y-1}" width="${10*(w+g)+4}" height="${h+8}" rx="8" fill="none" stroke="#e53935" stroke-width="2" stroke-dasharray="5 3"/>`;
    s+=`<path d="M${10*(w+g)+14} ${y+11}H${10*(w+g)+34}" stroke="${INK}" stroke-width="2.4"/><path d="M${10*(w+g)+34} ${y+11}l-6-5v10z" fill="${INK}"/>`;
    s+=tok(10*(w+g)+40,y+1,p+1,{w:36,h:20});
    y+=h+12;
  }
  if(r>0){for(let c=0;c<r;c++)s+=tok(10+c*(w+g),y+3,p);y+=h+12}
  s+=tx(180,y+14,`10 個「${VAL[p]}」換成 1 個「${VAL[p+1]}」${r?`，剩下 ${r} 個`:''}`,{a:'middle',s:13});
  return svg(y+26,s,`${total} 個${NM[p]}滿十換大`);
}
function vf(a,b,ans,st){
  const N=String(ans).length,ds=String(a).split('').reverse();
  const cell=(t,cls)=>`<span class="vc ${cls||''}">${t}</span>`;
  let h='<div class="vf" style="grid-template-columns:repeat('+(N+1)+',2.1em)">';
  h+=cell('');for(let p=N-1;p>=0;p--)h+=cell(st.car[p]!==undefined&&st.car[p]!==''?st.car[p]:'','cr'+(st.hl===p?' hl':''));
  h+=cell('');for(let p=N-1;p>=0;p--)h+=cell(ds[p]!==undefined?ds[p]:'',st.hl===p?'hl':'');
  h+=cell('×');for(let p=N-1;p>=0;p--)h+=cell(p===0?b:'');
  h+='<span class="vl" style="grid-column:1/-1"></span>';
  h+=cell('');for(let p=N-1;p>=0;p--)h+=cell(st.res[p]!==undefined?st.res[p]:'','rs'+(st.hl===p?' hl':''));
  return h+'</div>';
}
function steps(q){
  const m=parse(q);if(!m)return null;
  const {a,b,ans}=m,ds=String(a).split('').reverse().map(Number),k=ds.length-1,est=Math.round(a/10**k)*10**k;
  const out=[],res=[],car=[];const S0=()=>({res:res.slice(),car:car.slice(),hl:-1});
  out.push({title:m.word?'先看懂題目':'這題在算什麼？',text:`把 ${b} 個 ${a} 合起來，就是 ${a} × ${b}。`,vis:bar(a,b),st:S0()});
  out.push({title:'先估一估',text:`${a} 接近 ${est}，${est} × ${b} ＝ ${est*b}。所以答案應該會接近 ${est*b}。`,vis:'',big:`${a} ≈ ${est}\n${est} × ${b} ≈ ${est*b}`,st:S0()});
  let c=0;
  for(let i=0;i<ds.length;i++){
    const d=ds[i],tot=d*b+c,r=tot%10,nc=Math.floor(tot/10),last=i===ds.length-1;
    car[i]=c?c:'';
    const base=`${PN[i]}：${d} 個「${VAL[i]}」× ${b} 組${c?`，再加進位來的 ${c} 個`:''}，一共 ${tot} 個「${VAL[i]}」。`;
    if(tot>=10){
      out.push({title:`${PN[i]}先算`,text:base,vis:arr(d,b,c,i),st:{res:res.slice(),car:car.slice(),hl:i}});
      const rr=res.slice();
      if(last){String(tot).split('').reverse().forEach((x,j)=>rr[i+j]=x)}else rr[i]=String(r);
      const cc=car.slice();if(!last)cc[i+1]=nc;
      out.push({title:`${PN[i]}：滿十要換大`,text:last?`${tot} 個「${VAL[i]}」，滿 10 個換成 1 個「${VAL[i+1]}」，所以寫 ${tot}。`:`滿 10 個「${VAL[i]}」換成 1 個「${VAL[i+1]}」，這一位剩 ${r}，寫 ${r}；進位 ${nc} 到${PN[i+1]}。`,vis:reg(tot,i),st:{res:rr,car:cc,hl:i}});
      if(last)res[i]=undefined,String(tot).split('').reverse().forEach((x,j)=>res[i+j]=x);else{res[i]=String(r);car[i+1]=nc}
      c=last?0:nc;
    }else{
      res[i]=String(tot);car[i+1]='';
      out.push({title:`${PN[i]}`,text:base+`不滿 10，不用進位，直接寫 ${tot}。`,vis:arr(d,b,c,i),st:{res:res.slice(),car:car.slice(),hl:i}});
      c=0;
    }
  }
  out.push({title:'合起來',text:`${a} × ${b} ＝ ${ans}。和估算的 ${est*b} 很接近，合理！`,vis:'',st:{res:res.slice(),car:car.slice(),hl:-1},big:`${a} × ${b} ＝ ${ans}`});
  out.forEach(s=>{if(!s.vis)s.vis='';s.vf=vf(a,b,ans,s.st)});
  return out;
}
return {steps,parse};})();

{"sub":"math","t":"10000 以內的數","en":"","pg":"","ic":"🔢","c":SUB.math.c,"m":["info"],"info":{"h":"10000 以內的數 解題步驟","r":[["數一數（積木、錢幣）：先分千、百、十、一，每種各數幾個，再合起來。","例如 3 個千、1 個百、4 個十、5 個一，合起來是 3145；沒有的那一位要寫 0"],["填位值表：由左到右是千位、百位、十位、個位。","某一位沒有數，就寫 0 占位，例如 5014 的百位是 0"],["讀數字：由左到右一位一位讀；中間有 0 要讀「零」，連續的 0 只讀一個「零」。","5014 讀作五千零一十四；3010 讀作三千零一十"],["多 1、多 10、多 100、多 1000：只有那一位的數字加 1，其他位不變；「少」就是那一位減 1。","3928 多 100 是 4028；5425 少 1000 是 4425"],["數的順序（數列）：先看前兩個數差多少，是每次加還是減，再往後填。","9999 再多 1 是 10000；小心進位，例如 4990、5000 要看清楚是哪一位在變"],["比大小：先比位數，位數多的比較大；位數一樣，從最高位（千位）開始比，一樣再比下一位。","6120 和 6012：千位都是 6，百位 1 大於 0，所以 6120 比較大"],["排大小：先找最大（或最小）的，再找剩下的，依序寫下來，最後再檢查一次。","由小到大用「＜」，由大到小用「＞」"],["點數錢幣、湊價錢：先數大面額（1000、100），再數 10 元、1 元，最後加起來。","湊價錢時從大面額開始湊，例如 3255 元：3 張 1000、2 張 100、5 個 10、5 個 1"],["不夠多少錢：不夠的錢 ＝ 價錢 － 有的錢。","2700 元的咖啡機，有 2200 元，不夠 2700－2200＝500 元"],["用數字卡排四位數：最大 → 由大到小排；最小 → 由小到大排，但千位不能是 0。","0、2、3、6 排最小是 2036，不是 0236"],["被遮住的數字：最多 → 遮住的位填 9；最少 → 遮住的位填 0。","7？90：最多 7990，最少 7090"],["換算：10 張 100 元 ＝ 1 張 1000 元；1 張 100 元 ＝ 10 個 10 元；1 張 1000 元 ＝ 100 個 10 元。","換算時想：一個大的等於幾個小的"]]},"w":[],"d":[],"tf":[],"calc":[],"so":[],"mt":[],"parent":[]},
{"sub":"math","t":"10000 以內的加減","en":"","pg":"","ic":"➕","c":SUB.math.c,"m":["info"],"info":{"h":"10000 以內的加減 解題步驟","r":[["加法直式：相同數位對齊，從個位開始加，滿 10 就進位。","例如 2345＋3126＝5471；個位 5＋6＝11，寫 1 進 1"],["減法直式：從個位開始減，不夠減就向左邊的位借 1，借來的 1 變成 10。","遇到 0 要連續向左借，例如 6000－2748"],["先用算式記下來，再用直式算：圈出數字和問題，想一想是「合起來」還是「剩下、比較少」。","「一共」「合起來」「比…多」用加；「還剩」「比…少」「找回」用減"],["驗算：加法用「和 － 其中一個加數」，看是不是另一個加數；減法用「差 ＋ 減數」，看是不是被減數。","3648＋1952＝5600，驗算 5600－1952＝3648"],["算算看（　）裡的數：先想清楚（　）是加數、被減數還是減數。","（　）＋1560＝6825 → 6825－1560；7200－（　）＝2020 → 7200－2020"],["線段圖：整條線代表全部，分成兩段；不知道的那一段用「？」表示。","全部 ＝ 部分 ＋ 部分；部分 ＝ 全部 － 另一部分"],["看表、看圖解題：先找出題目問的是哪一個數，再從表或圖找出需要的數字。","不夠的錢 ＝ 價錢 － 有的錢；兩條路相差 ＝ 長的 － 短的"]]},"w":[],"d":[],"tf":[],"calc":[],"so":[],"mt":[],"parent":[]},{"sub":"math","t":"毫米與數線","en":"","pg":"","ic":"📏","c":SUB.math.c,"m":["info"],"info":{"h":"毫米與數線 解題步驟","r":[["1 公分 ＝ 10 毫米。尺上每一小格是 1 毫米，每一大格是 1 公分。","3 公分 4 毫米 ＝ 34 毫米；86 毫米 ＝ 8 公分 6 毫米"],["量長度：物品的左邊對準 0，看右邊對到的刻度，先讀幾公分，再數多幾小格就是幾毫米。","讀到 7，再多 4 小格，就是 7 公分 4 毫米"],["選單位：很短的用毫米，一般文具、身高用公分，很長的（操場、馬路）用公尺。","鉛筆盒約 20 公分；操場跑道約 200 公尺"],["長度比大小：先換成同樣的單位（都換成毫米），再比。","10 公分 ＝ 100 毫米，所以 10 公分 ＞ 90 毫米"],["長度加減：公分和公分、毫米和毫米分開算；毫米滿 10 要換成 1 公分，毫米不夠減要向公分借 1（＝10 毫米）。","5 公分 9 毫米 － 2 公分 8 毫米 ＝ 3 公分 1 毫米"],["數線：從 0 開始，每一格一樣長，向右越來越大，向左越來越小。","向右走用加，向左走用減；從 4 走到 9，走了 9－4＝5 格"],["「介於」兩個數之間：比小的大，比大的小。","15 和 18 之間可能是 16 或 17"]]},"w":[],"d":[],"tf":[],"calc":[],"so":[],"mt":[],"parent":[]},{"sub":"math","t":"乘法","en":"含二位數、三位數乘以一位數","pg":"","ic":"✖️","c":SUB.math.c,"m":["info"],"info":{"h":"乘法 解題步驟","r":[["二位數乘以一位數：先算個位，再算十位，滿 10 要記得進位。","例如 23×4＝92；68×6：8×6＝48 寫 8 進 4，6×6＝36 再加 4＝40，答案 408"],["整十、整百的乘法：先算前面的數字，再補上 0。","60×5＝300；800×7＝5600"],["三位數乘以一位數：個位、十位、百位依序乘，每一位都要加上進位；中間是 0 也要乘。","806×5：6×5＝30 寫 0 進 3，0×5＝0 加 3＝3，8×5＝40，答案 4030"],["應用題：看到「每…有…」「一共幾個」，想一想是不是同樣多的東西合起來，用乘法。","一盒 24 個，賣 9 盒 → 24×9＝216"],["乘法估算：把數字想成接近的整十或整百，再乘，就知道答案大約是多少。","399×7 ≈ 400×7＝2800；51×6 ≈ 50×6＝300"],["估算夠不夠、會不會比較便宜：先估算，再和錢（或數量）比一比。","395 元的草莓買 6 箱 ≈ 400×6＝2400，比 2000 多，所以 2000 元不夠"],["比大小：乘數一樣時，比被乘數就好；不 const AIPROMPT=`你是台灣國小老師，要把課本或習作（學習評量）的頁面照片，做成讓孩子「真的看懂」的課後輔導教材。用繁體中文（台灣用語）。
【讀照片的規則】（最重要）
1. 只讀「印刷」的內容：課文、題目、選項、圖說、表格。
2. 完全忽略：學生手寫的答案、鉛筆或原子筆的劃記與圈選、老師的紅筆批改（打勾、打叉、分數、評語）、貼紙、塗鴉。手寫答案可能是錯的，絕對不可當成正確答案；正確答案要依題目和學科知識自己判斷。
3. 題目被手寫字遮住或看不清時，依課本脈絡還原；真的無法還原就略過。
4. 題目盡量照課本「原樣」還原（文字可略為簡化），這些是「課本原題」。照片裡的圖，改用文字描述成題目。
【題目要靈活、多元，不是死背答案】
- 先還原課本原題（標記 o）；再依同樣的題型與觀念做「變化題」（標記 v）：換名詞（例如蘋果換成橘子）、換情境、換數量，觀念相同但答案不同，讓孩子必須理解才答得出來。變化題的數字運算要自己算對。
- 難度分三級：1 基礎（照課本、一個步驟）、2 進階（換情境、兩個步驟）、3 挑戰（綜合運用、需要推理）。挑戰題仍不可超出照片頁面的學習範圍。
- 每一題都要加「標記」：o1、o2、o3（課本原題的難度）或 v1、v2、v3（變化題的難度）。
- 題型要多樣：選擇、是非、配對、排序、計算與應用題。
先判斷科目（英文 en、國語 cn、數學 math、自然 sci、社會 soc）。只回傳一個 JSON 物件，不要 markdown，格式為 {"lessons":[...]}。每個元素代表一個單元或主題（同一回或同一課的內容放在同一個元素），格式：
{"sub":"en|cn|math|sci|soc","t":"中文標題（可含回次或課名）","en":"簡短副標題","pg":"頁碼或空字串","ic":"一個emoji",
"w":[["詞語","解釋","一個代表的emoji（同一段內不可重複）","圖庫代碼（沒有就空字串）"]],
"d":[["題目","提示（可空字串）","正確答案","為什麼（一句話）",["錯誤選項1","錯誤選項2","錯誤選項3"],"圖庫代碼（沒有就空字串）","標記"]],
"tf":[["一個敘述",true,"為什麼（一句話）","圖庫代碼（沒有就空字串）","標記"]],
"calc":[["數學題目",48,"提示",["解題步驟1","解題步驟2"],"標記"]],
"mt":[["左邊","右邊"]],
"so":[["詞語1 詞語2 詞語3 詞語4","提示","標記"]],
"info":{"h":"標題","r":[["重點","補充說明（可空字串）"]]},
"full":{"h":"課文標題（可含作者，沒有就空字串）","p":["第一段原文","第二段原文"]},

calc 的答案只能是單一數字（不含單位）。so 是排序題：把一個通順的句子，或一段過程的步驟，拆成 3 到 7 個詞語，詞語之間用空格，順序是正確答案。錯誤選項必須真的錯誤。
各科規則：
- 英文：w 放英文單字或句型（解釋用中文）；d 為對話問答；只用照片裡真的出現的內容。
- 國語「full」（課文全文）：只要照片裡有課文（或詩、對話、短文），就必須把課文「逐字、逐段、完整」抄進 full.p（一段一個字串，保留原本的標點與分段；詩要一行一個字串）。不可摘要、不可改寫、不可補寫看不到的字，看不清楚的字用「□」代替；注音符號不用抄。照片沒有課文（例如只有習作或生字頁），full 就填 null。
- 國語的「學習地圖」「閱讀階梯」頁：課名請以「學習地圖一」「閱讀階梯一」這樣的字樣開頭（照頁面上印的）；整理成重點、詞語和題目，一樣不要出計算題或口語跟讀題。
- 國語：頁面常見「課文大意、詞語解釋、字音字形比較、語句練習、成語、綜合練習」。w 放生字詞，解釋寫成「注音｜意思」；d 出詞義、字形辨別、選詞填空、名詞判斷；tf 依課文內容出是非題；mt 做「詞語配對意思」或「部件相加成字」；so 做「語句重組」（把詞語排成通順的句子）；info 放課文大意與重點。需要手寫的題目（寫國字、造句）請改成選擇、配對或排序。國語的注音、部首、字形、造詞，一律以教育部《重編國語辭典修訂本》為準，不確定的就不要出題；mt 的「部件相加成字」只在部件確實正確時才出。【國語是語文科】重點是「字詞怎麼用、句子怎麼寫」：字形字音辨別、詞語意義與用法、選詞填空、近義詞、句型（造句與改寫）、課文內容理解、成語運用、標點與修辭。絕對不要出：筆畫數或「去掉部首還有幾畫」這類計算題、數學計算題、「跟著唸／複誦」這類口說跟讀題。
- 數學：w 放重要概念；info 放解題步驟與常犯錯誤；d 出觀念選擇題；calc 放課本的計算題與應用題（標 o，照原題數字），再加 3 到 5 題換名詞、換數字、不同難度的變化題（標 v）；乘法題的第一個步驟請寫成「36 × 2」這樣的算式（兩個整數相乘，乘數 2 到 9），App 會自動畫出積木與直式圖解，並自動產生更多換數字的練習。不要放 tf 和 mt。
- 自然、社會：w 放重要名詞與解釋；w 的第 4 個欄位可填「圖庫代碼」讓 App 畫出示意圖，只有名詞和代碼的意思完全相同才填，不確定就空字串，不可自己編代碼：node（節）、leafOrder（葉序總覽）、alt（互生）、opp（對生）、who（輪生）、herb（草本莖）、tree（木本莖）、vine（藤本莖）、taproot（軸根）、fibrous（鬚根）、flower（花的構造：花萼花瓣雄蕊雌蕊）、watermelon（果實裡有種子）、pod（豆莢與豆）、seedGrow（種子發芽長大）、leafEdge（葉緣平滑與鋸齒）；d、tf 出題（d、tf 也可填圖庫代碼）；mt 做「名詞配對說明」或「植物配特徵」；so 可排「過程的順序」；info 放重點整理。圖片題請改用文字描述，例如「番石榴的葉序是哪一種」。
- 數量（頁面內容夠的話）：w 最多 16 筆；d 8 到 15 題；tf 5 到 10 題；mt 4 到 8 組（右邊不可重複）；calc 最多 12 題；so 2 到 6 題；parent 2 到 3 筆，要具體、好執行、不需要買東西。沒有適合內容的欄位可省略。`;

function clean(s){

  if(s.info)s.info.r=uniq(s.info.r,x=>x[0]).slice(0,12);

  if(s.sub==='sci')s.w.forEach(x=>{if(!x[3]){const k=DIAKW[x[0].replace(/\s+/g,'')];if(k)x.push(k)}});

function mergeL(a,b){

  a.w=a.w.concat(b.w);a.d=a.d.concat(b.d);a.tf=a.tf.concat(b.tf);a.calc=a.calc.concat(b.calc);a.mt=a.mt.concat(b.mt);a.parent=a.parent.concat(b.parent);a.so=(a.so||[]).concat(b.so||[]);
  if(b.info){if(a.info){a.info.r=a.info.r.concat(b.info.r);a.info.img=(a.info.img||[]).concat(b.info.img||[])}else a.info=b.info}

  if(!a.pg&&b.pg)a.pg=b.pg;
  return clean(a);
}

function norm(s){
  if(!s||!s.t)return null;
  if((SUB[s.sub]?s.sub:'')==='cn'||s.lang==='zh'&&!SUB[s.sub]){['d','tf','so','mt','w'].forEach(k=>{s[k]=arr(s[k]).filter(x=>!BADCN.test(JSON.stringify(x)))})}

  const TAG=/^[ov][123]$/,key=a=>a.map(String).find(k=>DIA[k])||'',tag=a=>a.map(String).find(k=>TAG.test(k))||'';
  const w=arr(s.w).filter(x=>arr(x).length>=3).slice(0,30).map(x=>[String(x[0]),String(x[1]),String(x[2]),...(x[3]&&DIA[x[3]]?[String(x[3])]:[])]);
  const d=arr(s.d).filter(x=>arr(x).length>=5&&arr(x[4]).length>=2).slice(0,10).map(x=>[String(x[0]),String(x[1]),String(x[2]),String(x[3]),x[4].slice(0,3).map(String),key(x.slice(5)),tag(x.slice(5))]);
  const tf=arr(s.tf).filter(x=>arr(x).length>=2).slice(0,8).map(x=>[String(x[0]),x[1]===true||x[1]==='true'||x[1]==='對',String(x[2]||''),key(x.slice(3)),tag(x.slice(3))]);
  const calcs=(sub==='cn'?[]:arr(s.calc)).filter(x=>arr(x).length>=2).slice(0,12).map(x=>[String(x[0]),String(x[1]),String(x[2]||''),arr(x[3]).map(String),tag(x.slice(4))]);
  const so=arr(s.so).filter(x=>arr(x).length>=1&&String(x[0]).trim().split(/[\s｜|]+/).filter(Boolean).length>=3).slice(0,12).map(x=>[String(x[0]).trim().replace(/[｜|]+/g,' ').replace(/\s+/g,' '),String(x[1]||''),tag(x.slice(2))]);
  const mt=arr(s.mt).filter(x=>arr(x).length>=2).slice(0,6).map(x=>[String(x[0]),String(x[1])]);
  const r=s.info?arr(s.info.r).filter(x=>arr(x).length>=2).map(x=>x.slice(0,2).map(String)):[];
  const info=r.length?{h:String(s.info.h||'重點整理'),r}:null;
  const fp=s.full&&sub==='cn'?arr(s.full.p).map(x=>String(x).replace(/\s+$/,'')).filter(x=>x.trim()).slice(0,120):[];
  const full=fp.length?{h:String(s.full.h||''),p:fp}:null;
  const par=arr(s.parent).map(String).slice(0,5);
  const m=[];if(full)m.push('full');if(info)m.push('info');if(w.length)m.push('cards');if(w.length>=4&&sub==='en')m.push('listen');if(d.length)m.push('talk');if(tf.length)m.push('tf');if(calcs.length)m.push('calc');if(so.length)m.push('order');if(mt.length>=3)m.push('match');if(par.length)m.push('parent');
  if(!m.length)return null;
  return clean({date:iso(),sub,lang:sub==='en'?'en':'zh',t:String(s.t),en:String(s.en||''),pg:String(s.pg||''),ic:String(s.ic||SUB[sub].ic),c:SUB[sub].c,m,w,d,tf,calc:calcs,so,mt,info,full,parent:par,custom:1});
}

async function gGen(md,body,ctl){
  const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+md+':streamGenerateContent?alt=sse',{method:'POST',headers:{'content-type':'application/json','x-goog-api-key':AI.url},body,signal:ctl.signal});
  if(!r.ok)return {ok:false,status:r.status,tx:await r.text()};
  let txt='';
  const eat=line=>{line=line.trim();if(line.startsWith('data:')){try{const d=JSON.parse(line.slice(5)),c=arr(d.candidates)[0];txt+=arr(c&&c.content&&c.content.parts).map(q=>q.text||'').join('')}catch(e){}}};
  if(r.body&&r.body.getReader){const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
    for(;;){const x=await rd.read();if(x.done)break;buf+=dec.decode(x.value,{stream:true});let k;while((k=buf.indexOf('\n'))>=0){eat(buf.slice(0,k));buf=buf.slice(k+1)}}
    eat(buf)}
  else (await r.text()).split('\n').forEach(eat);

      if(txt.replace(/\s/g,'')===String(q[0]).replace(/\s/g,''))continue;

function genCalc(base,n){
  const seen=new Set(base.map(x=>String(x[0]))),out=[],ladder=S.lv?[+S.lv]:[1,2,3,2,1,3];

  if(!T.length)return out;
  for(let i=0,tries=0;out.length<n&&tries<n*12;tries++){
    const q=T[tries%T.length],v=mkVariant(q,ladder[i%ladder.length]);
    if(v&&!seen.has(v[0])){seen.add(v[0]);out.push(v);i++}
  }
  return out;
}
