.top{text-align:center;padding:12px 0 4px}
.tiles{margin:0;display:flex;justify-content:center;gap:8px}

.how{background:var(--card);border:3px dashed var(--line);border-radius:18px;padding:10px 16px}

.hh{font-size:1.3rem;margin:16px 0 8px}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mg>div{display:grid;gap:10px;align-content:start}
.dh{margin:18px 0 8px;font-size:1.05rem;color:var(--sub)}
.spd{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:5;min-height:52px;padding:8px 18px;border:3px solid var(--line);border-radius:99px;background:var(--paper);color:var(--onpaper);font-weight:700;box-shadow:0 4px 0 var(--line)}
.tb{height:14px;border:3px solid var(--line);border-radius:99px;background:var(--card);margin:12px auto 0;max-width:360px;overflow:hidden}.tbi{height:100%;background:#58b947}

.modes{display:grid;gap:14px}
.btn,.go{background:var(--card);border:3px solid var(--line);border-radius:18px;box-shadow:0 5px 0 var(--line);padding:14px 18px;display:flex;align-items:center;gap:14px;min-height:64px;text-align:left;width:100%}
.btn .ic{font-size:2rem}.btn b{display:block;font-size:1.2rem}.btn span.d{color:var(--sub);font-size:.95rem}.btn .st{margin-left:auto;white-space:nowrap}

.go.alt{background:var(--card);color:var(--ink)}
.fc{width:100%;background:var(--card);border:3px solid var(--line);border-radius:28px;box-shadow:0 6px 0 var(--line);min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:20px;animation:pop .25s}
.fc .big{font-size:6rem;line-height:1.1}.fc .w{font-size:3rem;font-weight:700}.fc .zh{font-size:3.2rem;font-weight:700}.fc .hint{color:var(--sub);font-size:.95rem}

.nav{display:flex;gap:12px;align-items:center;margin-top:16px}
.nav .go{margin:0;flex:1}.nav .cnt{font-weight:700;min-width:64px;text-align:center}
.say{width:56px;height:56px;border-radius:50%;border:3px solid var(--line);background:var(--paper);font-size:1.6rem;box-shadow:0 4px 0 var(--line);flex:none}
.prog{display:flex;justify-content:space-between;font-weight:700;margin-bottom:10px}
.q{display:flex;gap:14px;align-items:center;background:var(--card);border:3px solid var(--line);border-radius:22px;padding:16px;margin-bottom:16px}
.q p{margin:0;font-size:1.25rem}.q .z{display:block;color:var(--sub);font-size:.95rem}
.opts{display:grid;gap:12px}.opts.big{grid-template-columns:1fr 1fr}
.opt{background:var(--card);border:3px solid var(--line);border-radius:18px;box-shadow:0 4px 0 var(--line);padding:12px;min-height:56px;font-weight:700;font-size:1.1rem;font-family:Fredoka,"Noto Sans TC",sans-serif}
.big .opt{font-size:3.4rem;min-height:110px}
.opt.ok{background:var(--ok)}.opt.bad{background:var(--bad)}.opt:disabled{cursor:default;color:var(--ink)}
.fb{font-weight:700;margin:16px 0 0}.fb.good{color:var(--okl)}.fb.oops{color:var(--badl)}
.res{text-align:center;background:var(--card);border:3px solid var(--line);border-radius:28px;padding:28px 18px;margin-top:10px}

.say-l{display:flex;gap:10px;align-items:center;margin:10px 0}.say-l.r{flex-direction:row-reverse}
.bub{border:3px solid var(--line);border-radius:20px;padding:8px 16px;background:var(--card);text-align:left;flex:1;max-width:85%}
.say-l.r .bub{background:var(--paper);color:var(--onpaper)}
.bub .e{font-family:Fredoka,sans-serif;font-size:1.25rem;display:block}.bub .z{font-size:.9rem;opacity:.8}
.sep{height:10px}

.dg{margin:14px 0}.dg svg{border-radius:16px}.fc .dg{margin:0;width:100%}

.pcb{display:inline-block}.pcbtn{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:2px 10px;min-height:40px;font-weight:700;margin:2px 4px}.pcbtn.on{background:var(--ok)}.pcbtn.on.bad{background:var(--bad)}.pcrow{margin-top:2px}

.pi.zy{font-family:"Noto Sans TC",sans-serif}

const INK='#1b2a5c',COL=['#ffd54f','#81d4fa','#a5d6a7','#e1bee7','#ffab91'],NM=['一','十','百','千','萬'],PN=['個位','十位','百位','千位','萬位'],VAL=[1,10,100,1000,10000];
const tx=(x,y,t,o={})=>`<text x="${x}" y="${y}" ${F} font-size="${o.s||14}" font-weight="${o.w||700}" fill="${o.c||INK}" text-anchor="${o.a||'start'}">${t}</text>`;
const tok=(x,y,p,o={})=>{const l=String(VAL[p]);return `<rect x="${x}" y="${y}" width="${o.w||24}" height="${o.h||16}" rx="5" fill="${COL[p]}" stroke="${o.ring?'#e53935':'#546e7a'}" stroke-width="${o.ring?2.2:1.2}" ${o.ring?'stroke-dasharray="4 2"':''}/>`+tx(x+(o.w||24)/2,y+(o.h||16)/2+(l.length>3?3:4),l,{a:'middle',s:l.length>4?7:l.length>3?8:10,c:'#263238'})};
const svg=(h,b,cap)=>`<svg viewBox="0 0 360 ${h}" role="img" aria-label="${cap}" style="width:100%;height:auto;display:block;background:#fff;border:3px solid #1b2a5c;border-radius:16px">${b}</svg>`;

function parse(q){
  const src=[q[0],q[2],...(q[3]||[])].map(String);let m=null;
  for(const t of src){m=t.match(/(\d+)\s*[×xX＊*]\s*(\d+)/);if(m)break}
  if(!m)return null;let a=+m[1],b=+m[2];
  if(b>9&&a<=9){[a,b]=[b,a]}
  const ans=+String(q[1]).replace(/[^\d]/g,'');
  if(!(a>=10&&a<=9999&&b>=2&&b<=9)||a*b!==ans)return null;
  return {a,b,ans,word:!/^[\d\s×xX＝=？?]+$/.test(String(q[0]))};
}
function bar(a,b){
  const n=b,gap=4,W=330,bw=Math.min(70,(W-gap*(n-1))/n),tot=n*bw+gap*(n-1),x0=(360-tot)/2;
  let s='';for(let i=0;i<n;i++)s+=`<rect x="${x0+i*(bw+gap)}" y="64" width="${bw}" height="46" rx="6" fill="#ffe082" stroke="#8d6e00" stroke-width="2"/>`+tx(x0+i*(bw+gap)+bw/2,93,a,{a:'middle',s:bw<40?13:18});
  s+=`<path d="M${x0} 54Q${x0} 44 ${x0+10} 44H${x0+tot/2-10}Q${x0+tot/2} 44 ${x0+tot/2} 34Q${x0+tot/2} 44 ${x0+tot/2+10} 44H${x0+tot-10}Q${x0+tot} 44 ${x0+tot} 54" fill="none" stroke="#e53935" stroke-width="2.6"/>`+tx(x0+tot/2,26,'一共 ＝ ？',{a:'middle',s:17,c:'#e53935'});
  s+=`<path d="M${x0} 120V128H${x0+bw}V120" fill="none" stroke="${INK}" stroke-width="2.4"/>`+tx(x0+bw/2,148,'每份 '+a,{a:'middle',s:13})+tx(180,178,`共 ${b} 份，每份一樣多 → 用乘法`,{a:'middle',s:14});
  return svg(196,s,`${b} 份，每份 ${a}`);
}
function arr(d,b,cin,p){
  const w=24,h=16,g=4;let s='',y=34;
  s+=tx(180,20,`${d} 個「${VAL[p]}」× ${b} 組`,{a:'middle',s:15});
  const cols=Math.max(d,1),x0=(360-cols*(w+g)+g)/2;
  if(d>0)for(let r=0;r<b;r++){for(let c=0;c<d;c++)s+=tok(x0+c*(w+g),y,p);y+=h+g+2}
  else{s+=tx(180,y+14,'0 個，沒有東西',{a:'middle',s:14,c:'#78909c'});y+=26}
  if(cin>0){s+=tx(14,y+12,'進位來的：',{s:12});for(let c=0;c<cin;c++)s+=tok(96+c*(w+g),y,p,{ring:1});y+=h+8}
  return svg(y+8,s,`${d} 個${NM[p]} 乘 ${b}`);
}
function reg(total,p){
  const f=Math.floor(total/10),r=total%10,w=24,h=16,g=3;let s='',y=14;
  for(let i=0;i<f;i++){
    for(let c=0;c<10;c++)s+=tok(10+c*(w+g),y+3,p);
    s+=`<rect x="6" y="${y-1}" width="${10*(w+g)+4}" height="${h+8}" rx="8" fill="none" stroke="#e53935" stroke-width="2" stroke-dasharray="5 3"/>`;
    s+=`<path d="M${10*(w+g)+14} ${y+11}H${10*(w+g)+34}" stroke="${INK}" stroke-width="2.4"/><path d="M${10*(w+g)+34} ${y+11}l-6-5v10z" fill="${INK}"/>`;
    s+=tok(10*(w+g)+40,y+1,p+1,{w:36,h:20});
    y+=h+12;
  }
  if(r>0){for(let c=0;c<r;c++)s+=tok(10+c*(w+g),y+3,p);y+=h+12}
  s+=tx(180,y+14,`10 個「${VAL[p]}」換成 1 個「${VAL[p+1]}」${r?`，剩下 ${r} 個`:''}`,{a:'middle',s:13});
  return svg(y+26,s,`${total} 個${NM[p]}滿十換大`);
}
function vf(a,b,ans,st){
  const N=String(ans).length,ds=String(a).split('').reverse();
  const cell=(t,cls)=>`<span class="vc ${cls||''}">${t}</span>`;
  let h='<div class="vf" style="grid-template-columns:repeat('+(N+1)+',2.1em)">';
  h+=cell('');for(let p=N-1;p>=0;p--)h+=cell(st.car[p]!==undefined&&st.car[p]!==''?st.car[p]:'','cr'+(st.hl===p?' hl':''));
  h+=cell('');for(let p=N-1;p>=0;p--)h+=cell(ds[p]!==undefined?ds[p]:'',st.hl===p?'hl':'');
  h+=cell('×');for(let p=N-1;p>=0;p--)h+=cell(p===0?b:'');
  h+='<span class="vl" style="grid-column:1/-1"></span>';
  h+=cell('');for(let p=N-1;p>=0;p--)h+=cell(st.res[p]!==undefined?st.res[p]:'','rs'+(st.hl===p?' hl':''));
  return h+'</div>';
}
function steps(q){
  const m=parse(q);if(!m)return null;
  const {a,b,ans}=m,ds=String(a).split('').reverse().map(Number),k=ds.length-1,est=Math.round(a/10**k)*10**k;
  const out=[],res=[],car=[];const S0=()=>({res:res.slice(),car:car.slice(),hl:-1});
  out.push({title:m.word?'先看懂題目':'這題在算什麼？',text:`把 ${b} 個 ${a} 合起來，就是 ${a} × ${b}。`,vis:bar(a,b),st:S0()});
  out.push({title:'先估一估',text:`${a} 接近 ${est}，${est} × ${b} ＝ ${est*b}。所以答案應該會接近 ${est*b}。`,vis:'',big:`${a} ≈ ${est}\n${est} × ${b} ≈ ${est*b}`,st:S0()});
  let c=0;
  for(let i=0;i<ds.length;i++){
    const d=ds[i],tot=d*b+c,r=tot%10,nc=Math.floor(tot/10),last=i===ds.length-1;
    car[i]=c?c:'';
    const base=`${PN[i]}：${d} 個「${VAL[i]}」× ${b} 組${c?`，再加進位來的 ${c} 個`:''}，一共 ${tot} 個「${VAL[i]}」。`;
    if(tot>=10){
      out.push({title:`${PN[i]}先算`,text:base,vis:arr(d,b,c,i),st:{res:res.slice(),car:car.slice(),hl:i}});
      const rr=res.slice();
      if(last){String(tot).split('').reverse().forEach((x,j)=>rr[i+j]=x)}else rr[i]=String(r);
      const cc=car.slice();if(!last)cc[i+1]=nc;
      out.push({title:`${PN[i]}：滿十要換大`,text:last?`${tot} 個「${VAL[i]}」，滿 10 個換成 1 個「${VAL[i+1]}」，所以寫 ${tot}。`:`滿 10 個「${VAL[i]}」換成 1 個「${VAL[i+1]}」，這一位剩 ${r}，寫 ${r}；進位 ${nc} 到${PN[i+1]}。`,vis:reg(tot,i),st:{res:rr,car:cc,hl:i}});
      if(last)res[i]=undefined,String(tot).split('').reverse().forEach((x,j)=>res[i+j]=x);else{res[i]=String(r);car[i+1]=nc}
      c=last?0:nc;
    }else{
      res[i]=String(tot);car[i+1]='';
      out.push({title:`${PN[i]}`,text:base+`不滿 10，不用進位，直接寫 ${tot}。`,vis:arr(d,b,c,i),st:{res:res.slice(),car:car.slice(),hl:i}});
      c=0;
    }
  }
  out.push({title:'合起來',text:`${a} × ${b} ＝ ${ans}。和估算的 ${est*b} 很接近，合理！`,vis:'',st:{res:res.slice(),car:car.slice(),hl:-1},big:`${a} × ${b} ＝ ${ans}`});
  out.forEach(s=>{if(!s.vis)s.vis='';s.vf=vf(a,b,ans,s.st)});
  return out;
}
return {steps,parse};})();

const AIPROMPT=`你是台灣國小老師，要把課本或習作（學習評量）的頁面照片，做成讓孩子「真的看懂」的課後輔導教材。用繁體中文（台灣用語）。
【讀照片的規則】（最重要）
1. 只讀「印刷」的內容：課文、題目、選項、圖說、表格。
2. 完全忽略：學生手寫的答案、鉛筆或原子筆的劃記與圈選、老師的紅筆批改（打勾、打叉、分數、評語）、貼紙、塗鴉。手寫答案可能是錯的，絕對不可當成正確答案；正確答案要依題目和學科知識自己判斷。
3. 題目被手寫字遮住或看不清時，依課本脈絡還原；真的無法還原就略過。
4. 題目盡量照課本「原樣」還原（文字可略為簡化），這些是「課本原題」。照片裡的圖，改用文字描述成題目。
【題目要靈活、多元，不是死背答案】
- 先還原課本原題（標記 o）；再依同樣的題型與觀念做「變化題」（標記 v）：換名詞（例如蘋果換成橘子）、換情境、換數量，觀念相同但答案不同，讓孩子必須理解才答得出來。變化題的數字運算要自己算對。
- 難度分三級：1 基礎（照課本、一個步驟）、2 進階（換情境、兩個步驟）、3 挑戰（綜合運用、需要推理）。挑戰題仍不可超出照片頁面的學習範圍。
- 每一題都要加「標記」：o1、o2、o3（課本原題的難度）或 v1、v2、v3（變化題的難度）。

"so":[["詞語1 詞語2 詞語3 詞語4","提示","標記"]],

calc 的答案只能是單一數字（不含單位）。so 是排序題：把一個通順的句子，或一段過程的步驟，拆成 3 到 7 個詞語，詞語之間用空格，順序是正確答案。錯誤選項必須真的錯誤。
各科規則：
- 英文：w 放英文單字或句型（解釋用中文）；d 為對話問答；只用照片裡真的出現的內容。
- 國語：頁面常見「課文大意、詞語解釋、字音字形比較、語句練習、成語、綜合練習」。w 放生字詞，解釋寫成「注音｜意思」；d 出詞義、字形辨別、選詞填空、名詞判斷；tf 依課文內容出是非題；mt 做「詞語配對意思」或「部件相加成字」；so 做「語句重組」（把詞語排成通順的句子）；info 放課文大意與重點。需要手寫的題目（寫國字、造句）請改成選擇、配對或排序。國語的注音、部首、字形、造詞，一律以教育部《重編國語辭典修訂本》為準，不確定的就不要出題；mt 的「部件相加成字」只在部件確實正確時才出。【國語是語文科】重點是「字詞怎麼用、句子怎麼寫」：字形字音辨別、詞語意義與用法、選詞填空、近義詞、句型（造句與改寫）、課文內容理解、成語運用、標點與修辭。絕對不要出：筆畫數或「去掉部首還有幾畫」這類計算題、數學計算題、「跟著唸／複誦」這類口說跟讀題。
- 數學：w 放重要概念；info 放解題步驟與常犯錯誤；d 出觀念選擇題；calc 放課本的計算題與應用題（標 o，照原題數字），再加 3 到 5 題換名詞、換數字、不同難度的變化題（標 v）；乘法題的第一個步驟請寫成「36 × 2」這樣的算式（兩個整數相乘，乘數 2 到 9），App 會自動畫出積木與直式圖解，並自動產生更多換數字的練習。不要放 tf 和 mt。
- 自然、社會：w 放重要名詞與解釋；w 的第 4 個欄位可填「圖庫代碼」讓 App 畫出示意圖，只有名詞和代碼的意思完全相同才填，不確定就空字串，不可自己編代碼：node（節）、leafOrder（葉序總覽）、alt（互生）、opp（對生）、who（輪生）、herb（草本莖）、tree（木本莖）、vine（藤本莖）、taproot（軸根）、fibrous（鬚根）、flower（花的構造：花萼花瓣雄蕊雌蕊）、watermelon（果實裡有種子）、pod（豆莢與豆）、seedGrow（種子發芽長大）、leafEdge（葉緣平滑與鋸齒）；d、tf 出題（d、tf 也可填圖庫代碼）；mt 做「名詞配對說明」或「植物配特徵」；so 可排「過程的順序」；info 放重點整理。圖片題請改用文字描述，例如「番石榴的葉序是哪一種」。
- 數量（頁面內容夠的話）：w 最多 16 筆；d 8 到 15 題；tf 5 到 10 題；mt 4 到 8 組（右邊不可重複）；calc 最多 12 題；so 2 到 6 題；parent 2 到 3 筆，要具體、好執行、不需要買東西。沒有適合內容的欄位可省略。`;

function modes(s){

function clean(s){
  s.w=uniq(s.w,x=>x[0]).slice(0,30);s.d=uniq(s.d,x=>x[0]).slice(0,60);s.tf=uniq(s.tf,x=>x[0]).slice(0,40);s.calc=uniq(s.calc,x=>x[0]).slice(0,60);s.mt=uniq(s.mt,x=>x[0]).filter((x,i,a)=>a.findIndex(y=>y[1]===x[1])===i).slice(0,10);
  if(s.info)s.info.r=uniq(s.info.r,x=>x[0]).slice(0,12);
  s.so=uniq(s.so||[],x=>x[0]).slice(0,12);s.parent=uniq(s.parent,x=>x).slice(0,5);
  if(s.sub==='sci')s.w.forEach(x=>{if(!x[3]){const k=DIAKW[x[0].replace(/\s+/g,'')];if(k)x.push(k)}});

  if(s.d.length){const c=cnt(s.d,6);part.push(`選擇題 ${s.d.length}（基礎 ${c[1]}・進階 ${c[2]}・挑戰 ${c[3]}）`)}

  if(s.so&&s.so.length)part.push(`排序題 ${s.so.length}`);
  if(s.mt.length)part.push(`配對 ${s.mt.length} 組`);
  const math=s.calc&&s.calc.length;
  const short=[s.d.length&&s.d.length<S.nq?'選擇題':'',s.tf.length&&s.tf.length<S.nq?'是非題':''].filter(Boolean);
  return `<p style="font-weight:500;margin:10px 0 0;font-size:.9rem">題庫：${part.join('；')||'（這份沒有題目）'}${math?`<br>計算題：每次自動換新的數字，數量不受限制。`:''}</p>${short.length?`<p style="font-weight:500;margin:6px 0 0;font-size:.9rem;color:var(--badl)">⚠️ ${short.join('、')}的題庫不到 ${S.nq} 題，所以只會出現現有的題目；${S.lv?'選的難度題目不夠時，會用相近難度的題目補上。':''}按下面「✨ 再出題目」可以增加題庫。</p>`:''}`;
}
function moreBox(){

  ${S.more?`<div class="set" style="margin-top:12px"><p>想再出幾題？</p><div class="chips2">${[5,10,20].map(n=>`<button class="chip ${S.mn===n?'on':''}" data-a="mn" data-v="${n}">${n} 題</button>`).join('')}</div>
  <p>難度</p><div class="chips2">${[['','由易到難'],['1','基礎'],['2','進階'],['3','挑戰']].map(x=>`<button class="chip ${(S.ml||'')===x[0]?'on':''}" data-a="ml" data-v="${x[0]}">${x[1]}</button>`).join('')}</div>

function quiz(){

    return `<section class="res"><div class="stars">${bar(st)}</div><h2>${m}</h2><p>答對 ${S.sc} / ${S.qs.length} 題</p>
    <button class="go" data-a="mode" data-m="${S.mode}">再玩一次</button><button class="go alt" data-a="sec">回到單元</button></section>`;
  }
  const p=S.pick,right=p!==null&&q.o[p].ok,last=S.i===S.qs.length-1;
  return `${back('sec','回到單元')}<div class="prog"><span>第 ${S.i+1} / ${S.qs.length} 題</span><span>答對 ${S.sc}</span></div>
  ${tagHtml(q.tag)}<section class="q"><button class="say" data-a="play" aria-label="播放">🔊</button><p>${q.p}</p></section>
  <div class="opts ${q.big?'big':''}">${q.o.map((o,k)=>`<button class="opt ${p!==null?(o.ok?'ok':(p===k?'bad':'')):''}" data-a="pick" data-k="${k}" ${p!==null?'disabled':''}>${o.l}</button>`).join('')}</div>
  ${p!==null?`<p class="fb ${right?'good':'oops'}">${right?'🎉 答對了！':'再接再厲！正確答案：'} ${q.fb}</p>${q.img&&DIA[q.img]?`<div class="dg">${DIA[q.img]()}</div>`:''}<button class="go" data-a="nxt">${last?'看結果':'下一題'}</button>`:''}`;
}

  }catch(e){setOs('fb oops',typeof e==='string'&&/^AI 回傳/.test(e)?e:aiErr(e))}
}

SEC.forEach(s=>{if(s.ppk&&PPD[s.ppk])s.pp=Object.assign({vf:1,src:/^c5/.test(s.ppk)?1:0},PPD[s.ppk])});
loadDict();

function render(){app.innerHTML={home,sec,cards,info,dream,quiz,add,parent:parentV,dict,order,calc:calcV,match:matchV,paper:paperV}[S.v]()+spdBtn();if(S._v!==S.v){window.scrollTo(0,0);S._v=S.v}}
function startQuiz(m){
  if(m==='dict'||m==='order'||m==='calc'||m==='match'){startPr(m);return}
  const s=SEC[S.s];
  if(m==='listen'){
    S.qs=shuf(s.w).slice(0,6).map(w=>({play:w[0],p:'聽聽看，哪一個是這個說法？',big:1,fb:`${w[0]} ＝ ${w[1]}`,o:shuf([w,...shuf(s.w.filter(x=>x!==w)).slice(0,3)]).map(x=>({l:x[2],ok:x===w}))}));
  }else if(m==='tf'){S.qs=pick(s.tf,x=>x[4],S.nq).map(x=>({tag:x[4],play:x[0],p:x[0],fb:(x[1]?'正確。':'錯誤。')+x[2],img:x[3],o:[{l:'⭕ 對',ok:!!x[1]},{l:'❌ 錯',ok:!x[1]}]}))}else if(m==='blend'){
    S.qs=shuf(s.w).slice(0,6).map(w=>({play:w[0],p:'聽聽看，這個字用哪一個字母組合開頭？',big:1,fb:`${w[0]} ＝ ${w[1]}`,o:shuf(['sm','sn','sw','sl']).map(x=>({l:x,ok:w[0].startsWith(x)}))}));
  }else{
    S.qs=pick(s.d,x=>x[6],S.nq).map(d=>({tag:d[6],play:d[0],p:`${d[0]}<span class="z">${d[1]}</span>`,fb:`${d[2]}（${d[3]}）`,img:d[5],ans:d[2],o:shuf([d[2],...d[4]]).map(x=>({l:x,ok:x===d[2]}))}));
  }
  S.v='quiz';S.mode=m;S.i=0;S.sc=0;S.pick=null;S.done=false;render();say(S.qs[0].play);
}
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  const a=b.dataset.a,s=SEC[S.s];
  if(a.startsWith('p_')||a==='paperhome'){ppClick(b);return}
  if(a==='vtest'){say("Hello! Nice to meet you. Let's learn English together!");return}
  else if(a==='home'){S.v='home';S.note=''}
  else if(a==='add'){PF=[];S.v='add'}
  else if(a==='nq'){S.nq=+b.dataset.v;try{localStorage.setItem('english-park-nq',S.nq)}catch(x){}}
  else if(a==='lv'){S.lv=b.dataset.v;try{localStorage.setItem('english-park-lv',S.lv)}catch(x){}}
  else if(a==='more'){S.more=!S.more}
  else if(a==='mn'){S.mf=(document.getElementById('mf')||{value:S.mf||''}).value;S.mn=+b.dataset.v}
  else if(a==='ml'){S.mf=(document.getElementById('mf')||{value:S.mf||''}).value;S.ml=b.dataset.v}
  else if(a==='mgo'){aiMore();return}
  else if(a==='amat'){S.amat=b.dataset.f;document.querySelectorAll('#mc .chip').forEach(c=>c.classList.toggle('on',c.dataset.f===S.amat));return}
  else if(a==='asub'){S.asub=b.dataset.f;document.querySelectorAll('#sc .chip').forEach(c=>c.classList.toggle('on',c.dataset.f===S.asub));return}
  else if(a==='flt'){S.f=b.dataset.f}
  else if(a==='hint'){S.hint=!S.hint}
  else if(a==='teach'){const q=S.qs[S.i];S.ts=TCH.steps(q)||(q[3]||[]).map((x,i)=>({title:'第 '+(i+1)+' 步',text:x,vis:'',vf:''}));S.ti=0;S.teach=1;render();window.scrollTo(0,0);say(S.ts[0].text);return}
  else if(a==='tnext'){if(S.ti<S.ts.length-1){S.ti++;render();window.scrollTo(0,0);say(S.ts[S.ti].text);return}S.teach=0;window.scrollTo(0,0)}
  else if(a==='tprev'){if(S.ti>0){S.ti--;render();window.scrollTo(0,0);say(S.ts[S.ti].text)}return}
  else if(a==='tclose'){S.teach=0}
  else if(a==='tsay'){say(S.ts[S.ti].text);return}
  else if(a==='mp'){mpTap(b.dataset.s,+b.dataset.i);return}
  else if(a==='ai'){aiRun();return}
  else if(a==='aitest'){const k=document.getElementById('aiu').value.trim(),o=document.getElementById('aits');if(!k||/^https?:/i.test(k)||/^sk-ant-/.test(k)){o.textContent='這個測試只適用於 Google 金鑰，請先貼上金鑰。';return}aiTest(k,o);return}
  else if(a==='aisave'){AI.url=document.getElementById('aiu').value.trim();AI.code=document.getElementById('aic').value.trim();try{localStorage.setItem('english-park-ai',JSON.stringify(AI))}catch(x){}b.textContent='✅ 已儲存';return}
  else if(a==='paste'){
    const n=+b.dataset.k+1;
    try{navigator.clipboard.readText().then(x=>{const lx=document.getElementById('lx');
      if(lx&&x&&x.trim()){lx.value=(lx.value?lx.value+'\n':'')+x.trim();b.textContent='✅ 已貼上第 '+n+' 張（可再貼一次）';setOs('sub','✅ 已貼上，請檢查最下方的文字。')}
      else setOs('fb oops','剪貼簿是空的。請先在照片上長按文字並選「拷貝」。')}).catch(()=>setOs('fb oops','無法讀取剪貼簿。請長按最下方的文字框，選「貼上」。'))}
    catch(x){setOs('fb oops','無法讀取剪貼簿。請長按最下方的文字框，選「貼上」。')}
    return}
  else if(a==='del'){if(confirm('確定刪除這份作業嗎？')){s.del=1;saveLS();S.v='home'}}
  else if(a==='spd'){spi=(spi+1)%SP.length;try{localStorage.setItem('english-park-spd',spi)}catch(x){}b.textContent='🔊 語速：'+SP[spi].n;say('Listen and repeat.');return}
  else if(a==='mk'){mkLesson();return}
  else if(a==='goal'){GOAL=+b.dataset.g;try{localStorage.setItem('english-park-goal',GOAL)}catch(x){}}
  else if(a==='clr'){if(confirm('確定要清除自己建立的課程嗎？')){SEC.length=SEC0.length;LS=[];saveLS()}}
  else if(a==='ptask'){const k=S.s+'p'+b.dataset.i;P[k]=P[k]?0:1;save()}
  else if(a==='dplay'){say(S.qs[S.i][0]);return}
  else if(a==='tp'){S.bt.push(+b.dataset.k);render();say(S.tl[+b.dataset.k]);return}
  else if(a==='tb'){S.bt.splice(+b.dataset.j,1)}
  else if(a==='dchk'){
    S.ok=S.v==='dict'?nz(S.val)===nz(S.qs[S.i][0]):S.v==='calc'?cmpAns(S.val,S.qs[S.i][1]):S.bt.map(k=>S.tl[k]).join(' ')===S.qs[S.i][0].trim().split(/\s+/).join(' ');
    S.pick=true;if(S.ok)S.sc++;render();say(S.qs[S.i][0]);return}
  else if(a==='dnext'){
    if(S.i<S.qs.length-1){S.i++;S.pick=null;S.val='';S.hint=false;S.teach=0;if(S.v==='order')mkTiles();render();say(S.qs[S.i][0]);return}
    S.done=true;const st=calc(S.sc,S.qs.length),key=S.s+S.mode;if(st>(P[key]||0)){P[key]=st;save()}}
  else if(a==='sec'){if(b.dataset.i!==undefined){S.s=+b.dataset.i;S.note=''}S.v='sec'}
  else if(a==='mode'){
    const m=b.dataset.m;S.mode=m;
    if(m==='cards'){S.v='cards';S.i=0;S.flip=false;render();say(s.w[0][0]);return}
    if(m==='info'){P[S.s+'info']=1;save();S.v='info'}
    else if(m==='paper'){S.pp=null;S.v='paper'}
    else if(m==='parent'){S.v='parent'}
    else if(m==='dream'){P[S.s+'dream']=1;save();S.v='dream';S.dj=null}
    else{startQuiz(m);return}
  }
  else if(a==='flip'){S.flip=!S.flip}
  else if(a==='word'){say(s.w[S.i][0]);return}
  else if(a==='prev'){if(S.i>0){S.i--;S.flip=false;render();say(s.w[S.i][0])}return}
  else if(a==='next'){
    if(S.i<s.w.length-1){S.i++;S.flip=false;render();say(s.w[S.i][0]);return}
    P[S.s+'cards']=1;save();S.v='sec';
  }
  else if(a==='irow'){const r=s.info.r[+b.dataset.i];say(r[2]||r[0]);return}
  else if(a==='dj'){S.dj=+b.dataset.k;render();say('I want to be '+SEC[1].w[S.dj][0]+'.');return}
  else if(a==='dsay'){say('I want to be '+SEC[1].w[S.dj][0]+'.');return}
  else if(a==='play'){say(S.qs[S.i].play);return}
  else if(a==='pick'){
    const k=+b.dataset.k,q=S.qs[S.i];if(S.pick!==null)return;
    S.pick=k;if(q.o[k].ok)S.sc++;
    render();if(q.ans)say(q.ans);return;
  }
  else if(a==='nxt'){
    if(S.i<S.qs.length-1){S.i++;S.pick=null;render();say(S.qs[S.i].play);return}
    S.done=true;
    const st=calc(S.sc,S.qs.length),key=S.s+S.mode;
    if(st>(P[key]||0)){P[key]=st;save()}
  }
  render();
});
app.addEventListener('change',e=>{if(e.target.id==='vs'){VP=e.target.value;try{localStorage.setItem('english-park-voice',VP)}catch(x){}say("Hello! Nice to meet you.")}});
try{if(window.speechSynthesis){window.speechSynthesis.getVoices();window.speechSynthesis.onvoiceschanged=()=>{if(S.v==='home'&&!document.querySelector('details[open]'))render()}}}catch(e){}
(function(){try{const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');
x.fillStyle='#2f6fe4';x.fillRect(0,0,180,180);x.fillStyle='#ffe27a';x.beginPath();x.roundRect(24,40,132,100,16);x.fill();
x.fillStyle='#1b2a5c';x.font='700 64px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('ABC',90,92);
document.getElementById('touch').href=c.toDataURL('image/png')}catch(e){}})();
